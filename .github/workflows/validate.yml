name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.9 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run deterministic test suite
        run: python -m pytest

      - name: Validate repository hygiene
        run: python -m pytest discovery/tests/test_repository_hygiene.py -q

      - name: Validate generic Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Check patch whitespace
        run: git diff --check

  fresh-clone-contract:
    name: Fresh-clone platform contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Validate a state-independent fresh clone
        run: sh scripts/validate-fresh-clone.sh
