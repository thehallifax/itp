schema_version: 1
connectors:
  - id: aruba
    runtime_modes: [central]
    display_name: HPE Aruba Networking Central
    vendor: HPE Aruba Networking
    domains:
      - switching
      - wireless
    deployment_types:
      - Business
      - Enterprise
      - Home Lab
      - MSP
      - School
    implementation_status: supported
    guided_setup: false
    configuration_mode: manual
    credential_fields:
      - id: client_id
        env: ARUBA_CENTRAL_CLIENT_ID
        required: true
        secret: false
      - id: client_secret
        env: ARUBA_CENTRAL_CLIENT_SECRET
        required: true
        secret: true
      - id: refresh_token
        env: ARUBA_CENTRAL_REFRESH_TOKEN
        required: false
        secret: true
      - id: access_token
        env: ARUBA_CENTRAL_ACCESS_TOKEN
        required: false
        secret: true
    configuration_fields:
      - collectors.aruba.base_url
      - collectors.aruba.site
    secret_handling:
      templates:
        - secrets/aruba.env.example
      scope: root-or-profile
    capabilities:
      validation: true
      doctor: false
      status: true
      demo_fixture: false
    documentation: docs/collectors/aruba-central.md
    implementation: collectors/aruba/collector.py:ArubaCentralCollector
    dashboard_manifest: collectors/aruba/dashboard-manifest.yml
    aliases:
      - aruba-central
      - hpe-aruba-central
    notes: Read-only Aruba Central REST collector with OAuth renewal; guided setup is unavailable.
  - id: fortigate
    runtime_modes: [edge]
    display_name: FortiGate
    vendor: Fortinet
    domains: [firewall, internet, switching]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: supported
    guided_setup: false
    configuration_mode: manual
    credential_fields:
      - id: host
        env: FORTIGATE_HOST
        required: true
        secret: false
        configuration_field: collectors.fortigate.host
      - id: api_token
        env: FORTIGATE_API_TOKEN
        required: true
        secret: true
        prompt: {label: API token, example: read-only API token, help: FortiGate REST API administrator token, default: '', value_type: secret, sensitive: true}
    configuration_fields: [collectors.fortigate.host, collectors.fortigate.site]
    configuration_prompts:
      - {field: collectors.fortigate.host, label: FortiGate host, example: firewall.example.invalid, help: FortiGate hostname or HTTPS URL; a non-default port may be included; do not include /api/v2, default: '', value_type: host, sensitive: false, normalizer: https-host}
    secret_handling:
      templates: [secrets/fortigate.env.example]
      scope: root-or-profile
    capabilities: {validation: true, doctor: false, status: true, demo_fixture: false}
    documentation: collectors/fortigate/README.md
    implementation: collectors/fortigate/collector.py:FortiGateCollector
    dashboard_manifest: collectors/fortigate/dashboard-manifest.yml
    aliases: [fortinet, fortios]
    notes: Native read-only API collector; credential onboarding remains manual.

  - id: hyperv
    runtime_modes: [central]
    display_name: Microsoft Hyper-V
    vendor: Microsoft
    domains: [servers, virtualisation]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: profile-only
    guided_setup: false
    configuration_mode: profile-manual
    credential_fields: []
    configuration_fields: [virtualisation.endpoints]
    secret_handling:
      templates: [secrets/hyperv.env.example]
      scope: profile
    capabilities: {validation: true, doctor: false, status: true, demo_fixture: true}
    documentation: docs/collectors/hyperv.md
    implementation: collectors/hyperv/collector.py:HyperVCollector
    aliases: [hyper-v, microsoft-hyperv]
    notes: Profile-scoped read-only PowerShell collection; guided setup is unavailable.

  - id: mist
    runtime_modes: [central]
    display_name: Juniper Mist
    vendor: Juniper Networks
    domains: [switching, wireless]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: supported
    guided_setup: false
    configuration_mode: manual
    credential_fields:
      - id: organization_id
        env: MIST_ORG_ID
        required: true
        secret: false
        prompt: {label: Organisation ID, example: 00000000-0000-0000-0000-000000000000, help: Mist organisation UUID, default: '', value_type: uuid, sensitive: false}
      - id: api_token
        env: MIST_API_TOKEN
        required: true
        secret: true
        prompt: {label: API token, example: Mist API token, help: Read-only Mist API token, default: '', value_type: secret, sensitive: true}
    configuration_fields: [collectors.mist.base_url]
    configuration_prompts:
      - {field: collectors.mist.base_url, label: Juniper Mist API base URL, example: 'https://api.ac2.mist.com', help: Enter the regional API origin only; do not include /api/v1, default: 'https://api.mist.com', value_type: url, sensitive: false, normalizer: https-origin}
    secret_handling:
      templates: [secrets/mist.env.example]
      scope: root-or-profile
    capabilities: {validation: true, doctor: false, status: true, demo_fixture: false}
    documentation: collectors/mist/README.md
    implementation: collectors/mist/collector.py:MistCollector
    dashboard_manifest: collectors/mist/dashboard-manifest.yml
    aliases: [juniper-mist]
    notes: Native read-only cloud API collector; regional endpoint selection is manual.

  - id: paloalto
    runtime_modes: [edge]
    display_name: Palo Alto PAN-OS
    vendor: Palo Alto Networks
    domains: [firewall, internet]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: supported
    guided_setup: false
    configuration_mode: manual
    credential_fields:
      - {id: api_key, env: PALOALTO_API_KEY, required: true, secret: true}
    configuration_fields: [collectors.paloalto.base_url, collectors.paloalto.site]
    secret_handling:
      templates: [secrets/paloalto.env.example]
      scope: root-or-profile
    capabilities: {validation: true, doctor: false, status: true, demo_fixture: false}
    documentation: docs/collectors/paloalto.md
    implementation: collectors/paloalto/collector.py:PaloAltoCollector
    dashboard_manifest: collectors/paloalto/dashboard-manifest.yml
    aliases: [panos, pan-os, palo-alto]
    notes: Native read-only PAN-OS XML API collector; guided setup is unavailable.

  - id: papercut
    runtime_modes: [central]
    display_name: PaperCut MF
    vendor: PaperCut
    domains: [printing, servers]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: supported
    guided_setup: false
    configuration_mode: manual
    credential_fields:
      - id: authorization_key
        env: PAPERCUT_AUTHORIZATION_KEY
        env_aliases: [PAPERCUT_AUTHORIZATION]
        required: false
        secret: true
        prompt: {label: Authorization key, example: optional System Health authorization key, help: Leave blank when the endpoint does not require authorization, default: '', value_type: secret, sensitive: true}
    configuration_fields: [collectors.papercut.base_url, collectors.papercut.site]
    configuration_prompts:
      - {field: collectors.papercut.base_url, label: PaperCut MF HTTPS base URL, example: 'https://papercut.example.invalid', help: Include the HTTPS port when required; /api/health is removed automatically, default: '', value_type: host, sensitive: false, normalizer: papercut-health-origin}
    secret_handling:
      templates: [secrets/papercut.env.example]
      scope: root-or-profile
    capabilities: {validation: true, doctor: false, status: true, demo_fixture: false}
    documentation: collectors/papercut/README.md
    implementation: collectors/papercut/collector.py:PaperCutCollector
    dashboard_manifest: collectors/papercut/dashboard-manifest.yml
    aliases: [papercut-mf, pc-mf]
    notes: Read-only PaperCut MF System Health JSON API collector; guided setup remains manual.

  - id: proxmox
    runtime_modes: [central]
    display_name: Proxmox VE
    vendor: Proxmox Server Solutions
    domains: [servers, virtualisation]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: profile-only
    guided_setup: false
    configuration_mode: profile-manual
    credential_fields:
      - {id: token_id, env: PROXMOX_TOKEN_ID, required: true, secret: false}
      - {id: token_secret, env: PROXMOX_TOKEN_SECRET, required: true, secret: true}
    configuration_fields: [virtualisation.endpoints]
    secret_handling:
      templates: [secrets/proxmox.env.example]
      scope: profile
    capabilities: {validation: true, doctor: false, status: true, demo_fixture: true}
    documentation: docs/collectors/proxmox.md
    implementation: collectors/proxmox/collector.py:ProxmoxCollector
    aliases: [proxmox-ve, pve]
    notes: Profile-scoped read-only API provider; guided setup is unavailable.

  - id: snmp
    runtime_modes: [edge]
    display_name: SNMP Infrastructure
    vendor: Multi-vendor
    domains: [environmental, power, printing, servers, switching, wireless]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: supported
    guided_setup: false
    configuration_mode: manual
    credential_fields:
      - {id: community, env: NETWORK_SNMP_COMMUNITY, required: true, secret: true}
    configuration_fields: [networks, exclusions, snmp.version]
    secret_handling:
      templates: [secrets/snmp.env.example]
      scope: root-or-profile
    capabilities: {validation: false, doctor: false, status: true, demo_fixture: false}
    documentation: docs/collectors/snmp.md
    implementation: collectors/snmp/collector.py:SNMPCollector
    dashboard_manifest: collectors/snmp/dashboard-manifest.yml
    aliases: [snmp-infrastructure, telegraf-snmp]
    notes: Generic discovery and Telegraf generation; device-specific setup remains manual.

  - id: vmware
    runtime_modes: [central]
    display_name: VMware vSphere
    vendor: VMware
    domains: [servers, virtualisation]
    deployment_types: [Business, Enterprise, Home Lab, MSP, School]
    implementation_status: profile-only
    guided_setup: false
    configuration_mode: profile-manual
    credential_fields:
      - {id: username, env: VMWARE_USERNAME, required: true, secret: false}
      - {id: password, env: VMWARE_PASSWORD, required: true, secret: true}
    configuration_fields: [virtualisation.endpoints]
    secret_handling:
      templates: [secrets/vmware.env.example]
      scope: profile
    capabilities: {validation: true, doctor: false, status: true, demo_fixture: true}
    documentation: docs/collectors/vmware.md
    implementation: collectors/vmware/collector.py:VMwareCollector
    aliases: [vsphere, vcenter]
    notes: Profile-scoped read-only vCenter provider; guided setup is unavailable.
