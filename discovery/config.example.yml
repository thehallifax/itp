schema_version: 1
deployment_id: example
customer_id: example
customer: example
site_id: site:example-corporate
site: site:example-corporate

discovery:
  interval_seconds: 3600
  concurrency: 40
  timeout_seconds: 1.5
  retries: 1

snmp:
  version: 2
  communities:
    - public

networks:
  - cidr: 192.0.2.0/24
    purpose: network
  - cidr: 198.51.100.0/24
    purpose: printers
  - cidr: 203.0.113.0/24
    purpose: wireless

exclusions:
  - 192.0.2.1

inventory:
  enabled: true
  persistence_path: /app/runtime/inventory
  stale_after_seconds: 86400
  missing_after_seconds: 604800
  lifecycle_evaluation_interval_seconds: 3600
  lifecycle_history_max_events: 10000
  lifecycle_history_retention_days: 365
  preserve_legacy_outputs: true
  change_detection:
    enabled: true
    history_max_events: 20000
    history_retention_days: 365
    duplicate_suppression_seconds: 3600
    ignored_fields: []
    minimum_severity: info
    field_minimum_severity: {}
    hostname_pattern_exclusions: []
    device_type_exclusions: []
    enrichment_only_fields:
      - serial_number
      - mac_address
      - source_asset_id

operations:
  enabled: true
  interval_seconds: 300
  inventory_path: /app/runtime/inventory
  output_path: /app/runtime/operations
  dashboard_template: /app/dashboards/Infrastructure Overview/infrastructure-overview.json
  dashboard_output: /app/runtime/dashboard/grafana/infrastructure-overview.json
  capability_registry: /app/runtime/dashboard/managed/registry.json
  collector_overdue_seconds: 900

infrastructure:
  enabled: true
  inventory_path: /app/runtime/inventory
  operations_path: /app/runtime/operations
  output_path: /app/runtime/infrastructure
  dashboard_path: /app/runtime/dashboard
  status_freshness_seconds: 300
  sites_config: /app/config/sites.yml
  sites_output: /app/runtime/sites

services:
  enabled: true
  infrastructure_state: /app/runtime/infrastructure/state.json
  operations_state: /app/runtime/operations/operations.json
  capability_registry: /app/runtime/dashboard/managed/registry.json
  output_path: /app/runtime/services
  sites_config: /app/config/sites.yml

wallboard:
  enabled: true
  freshness_seconds: 900
  infrastructure_state: /app/runtime/infrastructure/state.json
  operations_state: /app/runtime/operations/operations.json
  sites_state: /app/runtime/sites/sites.json
  dashboard_template: /app/dashboards/Operations/operations-wallboard.json
  summary_output: /app/runtime/dashboard/wallboard-summary.json
  dashboard_output: /app/runtime/dashboard/operations/operations-wallboard.json
  capability_registry: /app/runtime/dashboard/managed/registry.json
  service_health: /app/runtime/services/service-health.json

# Optional durable canonical history. Disabled preserves pre-OPS-008 behaviour.
# Configure expected_sources before enabling removal authority.
state_history:
  enabled: false
  store_path: /app/runtime/state-history
  removal_policy: complete_only
  volatile_fields_policy: default
  expected_sources: []

# Optional OPS-009 notification delivery. Omission remains fully compatible.
notifications:
  enabled: false
  minimum_severity: warning
  repeat_suppression_seconds: 3600
  daemon_heartbeat_stale_seconds: 30
  channels:
    console:
      enabled: true
    webhook:
      enabled: false
      url: ${NOTIFICATION_WEBHOOK_URL}
      timeout_seconds: 5
      headers:
        Authorization: ${NOTIFICATION_WEBHOOK_AUTHORIZATION}

collectors:
  snmp:
    enabled: false
    execution: edge
  mist:
    enabled: false
    execution: central
    base_url: https://api.mist.com
    organization_id: ${MIST_ORG_ID}
    api_token: ${MIST_API_TOKEN}
    discovery_interval_seconds: 21600
    collection_interval_seconds: 120
    timeout_seconds: 20
  fortigate:
    enabled: false
    execution: edge
    host: ${FORTIGATE_HOST}
    api_token: ${FORTIGATE_API_TOKEN}
    verify_tls: ${FORTIGATE_VERIFY_TLS}
    customer: ${FORTIGATE_CUSTOMER}
    site: ${FORTIGATE_SITE}
    timeout_seconds: ${FORTIGATE_TIMEOUT_SECONDS}
    discovery_interval_seconds: 21600
    collection_interval_seconds: 60
    max_retries: 2
  paloalto:
    enabled: false
    execution: either
    site: customer-site-slug
    customer: Customer Name
    base_url: https://192.0.2.1
    api_key_env: PALOALTO_API_KEY
    verify_tls: true
    ca_bundle:
    timeout_seconds: 20
    discovery_interval_seconds: 21600
    collection_interval_seconds: 60
    max_retries: 2
    collect_interfaces: true
    collect_ha: true
    collect_system_resources: true
    collect_licenses: true
    collect_content_versions: true
    expected_interfaces: []
    licence_expiry_days: 30
    content_warning_days: 30
    content_critical_days: 90
    # WAN roles are never inferred. Use only interfaces confirmed by the operator.
    wan_interfaces:
      - name: ethernet1/1
        role: primary
        display_name: Primary Internet
      - name: ethernet1/2
        role: backup
        display_name: Backup Internet
  aruba:
    enabled: false
    execution: central
    customer: customer-id
    site: site:customer-site
    # Use the regional API gateway shown by Aruba Central.
    base_url: https://api-ap.central.arubanetworks.com
    token_url: https://api-ap.central.arubanetworks.com/oauth2/token
    auth_mode: refresh_token
    # Regional/API-generation overrides are optional. Empty optional paths
    # explicitly disable that resource class without affecting AP collection.
    # endpoints:
    #   switches: ""
    #   gateways: ""
    account_id:
    client_id_env: ARUBA_CENTRAL_CLIENT_ID
    client_secret_env: ARUBA_CENTRAL_CLIENT_SECRET
    refresh_token_env: ARUBA_CENTRAL_REFRESH_TOKEN
    access_token_env: ARUBA_CENTRAL_ACCESS_TOKEN
    verify_tls: true
    timeout_seconds: 20
    discovery_interval_seconds: 21600
    collection_interval_seconds: 120
    max_retries: 2
  papercut:
    enabled: false
    execution: central
    customer: Customer Name
    site: customer-site-slug
    base_url: https://papercut.example.test:9192
    authorization_key_env: PAPERCUT_AUTHORIZATION_KEY
    verify_tls: true
    timeout_seconds: 20
    discovery_interval_seconds: 21600
    collection_interval_seconds: 60
    max_retries: 2
    disk_warning_percent: 85
    jvm_warning_percent: 85
    held_jobs_warning: 25
    upgrade_assurance_warning_days: 90
    uptime_advisory_days: 180
