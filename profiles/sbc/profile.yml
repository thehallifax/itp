profile:
  id: sbc
  name: Northwind College
  environment: production
  timezone: Australia/Perth
  runtime_mode: central
identity:
  customer_id: sbc
deployment:
  mode: standalone
paths:
  discovery_config: profiles/sbc/discovery.yml
  sites_config: profiles/sbc/sites.yml
  dashboards_config: profiles/sbc/dashboards.yml
  secrets_dir: secrets/sbc
  runtime_dir: runtime/sbc
telemetry:
  deployment_id: sbc
  influx_bucket: itp_sbc
  influx_org: local_org
grafana:
  folder_prefix: SBC
  provisioning_namespace: sbc
ports:
  grafana: 3100
  influxdb: 8281
