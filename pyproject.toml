[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-telemetry-platform"
version = "0.1.0"
description = "Infrastructure telemetry, discovery, inventory, and monitoring platform."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "James Hallifax" }
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "pysnmp>=7.1,<8",
  "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.setuptools.packages.find]
include = [
  "collectors*",
  "analysis*",
  "itp_profiles*",
  "telemetry*"
]

[tool.pytest.ini_options]
testpaths = ["discovery/tests"]
addopts = "-q"
pythonpath = [
  ".",
  "discovery"
]
