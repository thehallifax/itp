# Transitional SNMP-to-canonical dual writes. Vendor measurements remain unchanged.
[[processors.clone]]
  namepass = ["printer_status", "network_device", "ups_status", "synology_status", "fortigate_system"]
  name_override = "device"

[[processors.clone]]
  namepass = ["fortigate_performance"]
  name_override = "performance"

[[processors.clone]]
  namepass = ["fortigate_interfaces"]
  name_override = "interface"

[[processors.clone]]
  namepass = ["wireless_access_point"]
  name_override = "wireless"

[[processors.clone]]
  namepass = ["printer_status", "network_device", "wireless_access_point", "ups_status", "synology_status", "fortigate_system"]
  name_override = "availability"

[[processors.starlark]]
  namepass = ["availability"]
  source = '''
def apply(metric):
    metric.fields["available"] = True
    return metric
'''
