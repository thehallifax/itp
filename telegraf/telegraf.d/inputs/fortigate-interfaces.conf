# FortiGate interface traffic and health

[[inputs.snmp]]
  agents = [""]
  version = 2
  community = "${FORTIGATE_SNMP_COMMUNITY}"
  timeout = "5s"
  retries = 2
  interval = "30s"
  name = "fortigate_interfaces"

  [inputs.snmp.tags]
    customer = "st-brigids"
    site = "st-brigids"
    vendor = "fortinet"
    platform = "fortigate"
    device_role = "firewall"
    device_ip = ""

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "fortigate_interfaces"
    inherit_tags = [
      "customer",
      "site",
      "vendor",
      "platform",
      "device_role",
      "device_ip",
      "hostname"
    ]

    [[inputs.snmp.table.field]]
      name = "interface_name"
      oid = "1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "interface_description"
      oid = "1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "admin_status"
      oid = "1.3.6.1.2.1.2.2.1.7"

    [[inputs.snmp.table.field]]
      name = "operational_status"
      oid = "1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "interface_speed_bps"
      oid = "1.3.6.1.2.1.31.1.1.1.15"

    [[inputs.snmp.table.field]]
      name = "in_octets"
      oid = "1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "out_octets"
      oid = "1.3.6.1.2.1.31.1.1.1.10"

    [[inputs.snmp.table.field]]
      name = "in_errors"
      oid = "1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "out_errors"
      oid = "1.3.6.1.2.1.2.2.1.20"

    [[inputs.snmp.table.field]]
      name = "in_discards"
      oid = "1.3.6.1.2.1.2.2.1.13"

    [[inputs.snmp.table.field]]
      name = "out_discards"
      oid = "1.3.6.1.2.1.2.2.1.19"
