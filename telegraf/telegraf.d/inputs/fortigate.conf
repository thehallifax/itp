# FortiGate SNMP polling
#
# Initial platform collector.
# Additional FortiGate metrics will be added after the modular
# configuration structure is validated.

[[inputs.snmp]]
  agents = [""]
  version = 2
  community = "${FORTIGATE_SNMP_COMMUNITY}"
  timeout = "5s"
  retries = 2
  interval = "30s"
  name = "fortigate_system"

  [inputs.snmp.tags]
    customer = "st-brigids"
    site = "st-brigids"
    vendor = "fortinet"
    platform = "fortigate"
    device_role = "firewall"
    device_ip = ""

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "description"
    oid = "1.3.6.1.2.1.1.1.0"

  [[inputs.snmp.field]]
    name = "uptime_ticks"
    oid = "1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "location"
    oid = "1.3.6.1.2.1.1.6.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "contact"
    oid = "1.3.6.1.2.1.1.4.0"
    is_tag = true
